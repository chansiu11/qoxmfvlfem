<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2D 배틀필드 로얄 - 멀티플레이어</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:sans-serif;display:grid;place-items:center}#load{padding:24px;text-align:center}small{display:block;margin-top:10px;color:#aaa}
</style>
</head>
<body>
<div id="load">게임 불러오는 중…<small id="msg">파일 확인 중</small></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge/Safari를 사용해 주세요.');
    let encoded='';
    for(let i=1;i<=10;i++){
      msg.textContent=`게임 데이터 ${i}/10 불러오는 중`;
      const name=`game-data/part${String(i).padStart(2,'0')}.txt?v=active-bots-36`;
      const res=await fetch(name,{cache:'no-store'});
      if(!res.ok) throw new Error(`${name} 로드 실패 (${res.status})`);
      encoded+=(await res.text()).trim();
    }
    msg.textContent='게임 시작 준비 중';
    const raw=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
    const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('load').innerHTML='<b>게임을 불러오지 못했습니다.</b><small>'+String(err.message||err)+'</small>';
  }
})();
</script>
</body>
</html>
